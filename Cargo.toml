[package]
name = "offcut"
version = "0.1.0"
edition = "2024"
description = "Find and safely remove the worktrees and caches that agents and builds leave behind"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
